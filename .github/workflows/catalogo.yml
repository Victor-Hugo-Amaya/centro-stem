name: Validar base de conocimiento

on:
  pull_request:
    paths: ["data/**", "scripts/catalogo.py", "docs/03-modelo-de-salida.md"]
  push:
    branches: [main]
    paths: ["data/**", "scripts/catalogo.py", "docs/03-modelo-de-salida.md"]

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Validar datos y referencias
        run: python3 scripts/catalogo.py
      - name: Comprobar que las tablas generadas están al día
        run: |
          python3 scripts/catalogo.py --generar --hoy "$(grep -m1 -o '[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}' docs/generado/catalogo.md)"
          git diff --exit-code docs/generado
