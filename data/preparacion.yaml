- id: prep-generation-unity
  nombre: "Desarrollador(a) Jr. en Unity"
  organizacion: org-generation-mexico
  familias: [fam-software-nube]
  modalidad: en_linea
  duracion: "14 semanas síncronas, más 12 semanas de empleabilidad"
  costo_participante: 0
