# --- Gratuitos de certificadores ---
- id: prep-aws-educate
  nombre: "AWS Educate"
  organizacion: org-aws
  familias: [fam-software-nube, fam-datos-ia]
  modalidad: en_linea_autodirigido
  costo_participante: 0
  publico: {edad_min: 13, nota: "Registro con correo electrónico. Bolsa de trabajo sólo para mayores de 18."}
  incluye: "Laboratorios prácticos (S3, EC2, VPC, RDS), cursos autodirigidos e insignias digitales."
  prepara_para: [cert-aws-clf-c02, cert-aws-aif-c01]
  advertencia: "La página no indica disponibilidad en español ni descuentos de examen."
  convocatoria: {estado: permanente}
  fuente_url: https://aws.amazon.com/education/awseducate/
  fecha_verificacion: 2026-10-24

