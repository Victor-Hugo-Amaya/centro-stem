# Cursos, bootcamps y rutas de preparación.
# `costo_participante: 0` significa gratuito para la persona (financiado por la organización o aliados).
# `convocatoria.estado`: abierta | cerrada | permanente | por_confirmar.

# --- Generation México (socio prioritario) ---
# Requisitos generales (FAQ de Generation): buscar empleo activamente, no tener empleo actual,
# aprobar el proceso de selección y disponibilidad de tiempo completo.
- id: prep-generation-java-fullstack
  nombre: "Desarrollador/a Java Full Stack"
  organizacion: org-generation-mexico
  familias: [fam-software-nube]
  modalidad: en_linea
  duracion: "13 semanas, lunes a viernes de 9:30 a 17:30, más 12 semanas de acompañamiento de empleabilidad"
  costo_participante: 0
  publico: {edad_min: 18, edad_max: 29, nota: "Mayores de 29 pueden postularse con cupo limitado. Bachillerato terminado; prácticas o servicio social liberados. Preferentemente CDMX o Monterrey y zonas metropolitanas. No requiere experiencia en programación."}
  resultados: "Informe 2024: 74% empleado a 90 días y 90% a seis meses; ingreso promedio de $13,574 mensuales (2.79 veces el previo)."
  convocatoria: {estado: abierta, proxima_fecha: 2026-11-02, nota: "Grupos con inicio el 19-oct y el 2-nov listados en la página; la respuesta de selección tarda hasta 10 días."}
  fuente_url: https://mexico.generation.org/programs/java/
  fecha_verificacion: 2026-10-24

- id: prep-generation-aws-restart
  nombre: "AWS re/Start con especialización en IA Foundational"
  organizacion: org-generation-mexico
  familias: [fam-software-nube, fam-datos-ia]
  modalidad: en_linea
  duracion: "15 semanas síncronas, lunes a viernes de 9:30 a 17:30, más 12 semanas de empleabilidad"
  costo_participante: 0
  publico: {edad_min: 22, edad_max: 29, nota: "Licenciatura o ingeniería terminada o trunca. CDMX, Estado de México (zona metropolitana) y Monterrey."}
  prepara_para: [cert-aws-clf-c02, cert-aws-aif-c01]
  convocatoria: {estado: por_confirmar, nota: "La página muestra fechas incongruentes ('12 de octubre' y 'AWS02 - JUN 15'). No indica si incluye voucher de examen."}
  fuente_url: https://mexico.generation.org/programs/aws-cloud/
  fecha_verificacion: 2026-10-24

