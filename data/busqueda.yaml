# Semillas del loop semanal de oportunidades (paso 3, docs/07-loop-semanal.md).
#
# Mientras no haya respuestas reales del cuestionario, estas semillas hacen las veces de
# `semillas_busqueda` (docs/03 §2): una por familia y por ruta. Cuando el prototipo (paso 4)
# reciba respuestas, el loop sumará las palabras clave y alertas agregadas de los usuarios.
#
# ruta_estudiante: lo que se busca para secundaria, prepa y universidad. Por la regla de
#   menores (docs/03 §6) NUNCA incluye vacantes: sólo prácticas, becario, servicio social,
#   retos, becas, eventos y voluntariados. Las prácticas se muestran sólo a mayores de 18.
# ruta_cambio: vacantes de entrada (junior, trainee, técnico), bootcamps y vouchers.
# certificaciones: patrones (minúsculas, sin acentos) para contar cuántas vacantes mencionan
#   cada certificación del catálogo. Es la "demanda observada" que sustituirá poco a poco el
#   puntaje inicial de familias.yaml.

familias:
  fam-datos-ia:
    ruta_estudiante: ["becario análisis de datos", "practicante ciencia de datos", "hackathon inteligencia artificial"]
    ruta_cambio: ["analista de datos junior", "data analyst junior", "analista BI Power BI", "científico de datos trainee"]
  fam-ciberseguridad:
    ruta_estudiante: ["becario ciberseguridad", "practicante seguridad informática", "CTF ciberseguridad estudiantes"]
    ruta_cambio: ["analista SOC junior", "analista de ciberseguridad junior", "soc analyst trainee"]
  fam-software-nube:
    ruta_estudiante: ["becario desarrollo de software", "practicante programador", "hackathon estudiantes"]
    ruta_cambio: ["desarrollador junior", "programador trainee", "ingeniero de nube junior", "devops junior"]
  fam-manufactura-avanzada:
    ruta_estudiante: ["becario ingeniería mecatrónica", "practicante automatización", "educación dual mecatrónica"]
    ruta_cambio: ["técnico en automatización", "técnico mantenimiento industrial", "ingeniero de calidad junior", "técnico PLC"]
  fam-energia-ambiente:
    ruta_estudiante: ["becario energías renovables", "practicante ingeniería ambiental"]
    ruta_cambio: ["técnico fotovoltaico", "instalador paneles solares", "ingeniero ambiental junior"]
  fam-soporte-ti-redes:
    ruta_estudiante: ["becario soporte técnico", "practicante sistemas"]
    ruta_cambio: ["soporte técnico helpdesk", "técnico de redes junior", "mesa de ayuda"]
  fam-salud-biotecnologia:
    ruta_estudiante: ["becario laboratorio", "practicante biotecnología"]
    ruta_cambio: ["técnico de laboratorio", "auxiliar laboratorio clínico"]
  fam-gestion-proyectos:
    ruta_estudiante: ["becario PMO", "practicante gestión de proyectos"]
    ruta_cambio: ["coordinador de proyectos junior", "analista PMO", "scrum master junior"]
  fam-ux-diseno:
    ruta_estudiante: ["becario diseño UX", "practicante UX UI"]
    ruta_cambio: ["diseñador UX UI junior", "ux researcher junior"]
  # fam-administracion-contabilidad está en descenso: no se buscan vacantes del área; la ruta B
  # la usa como origen (reconversión), no como destino.

# Patrones por certificación. Se comparan contra título y descripción normalizados
# (minúsculas, sin acentos). Un patrón corto y ambiguo ("cc", "pmp") va con espacios o signos.
certificaciones:
  cert-google-data-analytics: ["google data analytics"]
  cert-microsoft-pl-300: ["pl-300", "power bi data analyst"]
  cert-microsoft-ai-901: ["ai-901", "ai-900", "azure ai fundamentals"]
  cert-aws-aif-c01: ["aif-c01", "aws certified ai practitioner"]
  cert-isc2-cc: ["isc2 cc", "certified in cybersecurity"]
  cert-cisco-ccst-cybersecurity: ["ccst"]
  cert-comptia-security-plus: ["security+", "security plus", "sy0-701"]
  cert-aws-clf-c02: ["clf-c02", "cloud practitioner"]
  cert-microsoft-az-900: ["az-900", "azure fundamentals"]
  cert-google-cloud-digital-leader: ["cloud digital leader"]
  cert-cisco-ccna: ["ccna"]
  cert-solidworks-cswa: ["cswa", "solidworks associate"]
  cert-autodesk-autocad-professional: ["autocad certified", "autocad professional"]
  cert-asq-cssgb: ["green belt", "cssgb"]
  cert-nabcep-pv-associate: ["nabcep"]
  cert-pmi-capm: ["capm"]

# Términos que clasifican un resultado por tipo. El primero que coincide gana. `senior` queda fuera
# de la muestra de lectura: el público del proyecto busca su primer empleo o un cambio de carrera.
tipos:
  practicas: ["becario", "becaria", "practicante", "practicas profesionales", "intern", "internship", "servicio social", "estadia", "trainee"]
  senior: ["senior", "sr", "lead", "lider", "manager", "gerente", "director", "staff", "principal", "head"]
  vacante_entrada: ["jr", "junior", "entry level", "early career", "auxiliar", "tecnico", "asociado", "associate"]

# Ubicaciones aceptadas. "remoto" sólo cuenta si además menciona México o LatAm.
ubicaciones:
  mexico: ["mexico", "cdmx", "ciudad de mexico", "jalisco", "guadalajara", "nuevo leon", "monterrey", "queretaro", "puebla", "estado de mexico", "guanajuato", "leon", "chihuahua", "sonora", "baja california", "tijuana", "coahuila", "saltillo", "san luis potosi", "aguascalientes", "yucatan", "merida"]
  remoto_latam: ["latam", "latin america", "america latina", "remote - mexico", "remoto mexico"]

# Requisitos -> certificaciones recomendadas (lectura de la muestra semanal, docs/07 §5 bis).
# Cuando una vacante pide una tecnología o habilidad, se recomiendan las certificaciones del
# catálogo de esa ruta. La experiencia pedida decide el nivel (`nivel_escalera` de
# certificaciones.yaml): prácticas o menos de 1 año -> nivel 1; 1 año o más -> la de mayor nivel
# disponible. `falta_en_catalogo` nombra la certificación de rol del nivel indicado que todavía no
# está en el catálogo; se reporta cuando una vacante pide ese nivel y la revisión mensual decide
# si se agrega.
tecnologias:
  aws:
    patrones: ["aws", "amazon web services", "ec2", "lambda", "s3"]
    certificaciones: [cert-aws-clf-c02, cert-aws-aif-c01]
    falta_en_catalogo: {nombre: "AWS Certified Solutions Architect – Associate", nivel: 2}
  azure:
    patrones: ["azure", "microsoft cloud"]
    certificaciones: [cert-microsoft-az-900]
    falta_en_catalogo: {nombre: "Microsoft AZ-104 Azure Administrator Associate", nivel: 2}
  gcp:
    patrones: ["gcp", "google cloud", "bigquery"]
    certificaciones: [cert-google-cloud-digital-leader]
    falta_en_catalogo: {nombre: "Google Cloud Associate Cloud Engineer", nivel: 2}
  analisis_datos:
    patrones: ["power bi", "tableau", "sql", "analisis de datos", "data analysis", "excel avanzado"]
    certificaciones: [cert-google-data-analytics, cert-microsoft-pl-300]
  inteligencia_artificial:
    patrones: ["machine learning", "aprendizaje automatico", "inteligencia artificial", "genai", "ia generativa", "llm"]
    certificaciones: [cert-microsoft-ai-901, cert-aws-aif-c01]
  ciberseguridad:
    patrones: ["ciberseguridad", "cybersecurity", "seguridad de la informacion", "soc", "siem", "pentesting"]
    certificaciones: [cert-isc2-cc, cert-cisco-ccst-cybersecurity, cert-comptia-security-plus]
  redes:
    patrones: ["redes", "networking", "cisco", "tcp/ip", "switching", "routing"]
    certificaciones: [cert-cisco-ccna]
    falta_en_catalogo: {nombre: "Cisco CCST Networking", nivel: 1}
  gestion_proyectos:
    patrones: ["pmo", "gestion de proyectos", "project management", "scrum", "agile"]
    certificaciones: [cert-pmi-capm]
  cad_diseno:
    patrones: ["autocad", "solidworks", "cad", "diseno mecanico"]
    certificaciones: [cert-solidworks-cswa, cert-autodesk-autocad-professional]
  calidad_manufactura:
    patrones: ["six sigma", "lean", "calidad", "mejora continua", "kaizen"]
    certificaciones: [cert-asq-cssgb]
  energia_solar:
    patrones: ["fotovoltaico", "paneles solares", "energia solar", "photovoltaic"]
    certificaciones: [cert-nabcep-pv-associate]
