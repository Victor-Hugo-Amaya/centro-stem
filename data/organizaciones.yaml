# Organizaciones: socios prioritarios, certificadores y programas públicos.
# `prioridad: socio` marca a los socios que Victor pidió priorizar.
# `estado: pendiente` significa que no hay enlace oficial verificado: no se muestra al usuario.

# --- Socios prioritarios ---
- id: org-ja-mexico
  nombre: "Junior Achievement México (JA México)"
  tipo: ong
  prioridad: socio
  descripcion: "Programas de emprendimiento, empleabilidad y finanzas personales. El sitio declara que 98% de sus programas son gratuitos gracias a sus aliados, en modalidad presencial y en línea."
  contacto: "WhatsApp 55 5211 9444; https://www.jamexico.org.mx/contacto"
  fuente_url: https://www.jamexico.org.mx/programasmx
  fecha_verificacion: 2026-10-24

- id: org-ja-americas
  nombre: "Junior Achievement Americas (JA Americas)"
  tipo: ong
  prioridad: socio
  descripcion: "Oficina regional de JA. Opera iniciativas regionales de empleabilidad (Mujer Digital, Pasaporte al empleo, Job Shadow), finanzas y emprendimiento, en varios casos junto con JA México."
  contacto: "info@jaamericas.org"
  fuente_url: https://jaamericas.org/programs
  fecha_verificacion: 2026-10-24

- id: org-generation-mexico
  nombre: "Generation México"
  tipo: ong
  prioridad: socio
  descripcion: "Bootcamps gratuitos de tiempo completo con acompañamiento de empleabilidad de 12 semanas, para personas de 18 a 29 años que buscan empleo."
  fuente_url: https://mexico.generation.org/encuentra-una-carrera/
  fecha_verificacion: 2026-10-24

- id: org-biociencia-wild
  nombre: "BioCiencia Wild"
  tipo: colectivo
  prioridad: socio
  estado: en_espera
