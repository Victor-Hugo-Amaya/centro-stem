# Certificaciones. Costos y vigencias consultados en la página oficial de cada certificador el 2026-10-24.
#
# Reglas (docs/03 §6 y docs/05 §3):
#   costo.verificado: true  -> el monto aparece en la página oficial citada en costo.fuente_url.
#   costo.verificado: false -> el monto proviene de una fuente secundaria o falta; el prototipo
#                              NO debe mostrarlo como dato firme.
#   vigencia_meses: null y no_caduca: true -> la credencial no vence.
#   vigencia_meses: null y no_caduca: false -> la vigencia no está confirmada (pendiente).
#   nivel_escalera: 1 fundamentos, 2 asociado o profesional de entrada, 3 especialidad.
#   idioma_es: true si el examen se ofrece en español; false si no; null si no está confirmado.

