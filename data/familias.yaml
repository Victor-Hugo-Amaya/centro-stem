- id: fam-energia-ambiente
  nombre: "Energía y gestión ambiental"
  nivel_demanda: alta
  puntaje_demanda: 75
  roles_ejemplo: ["ingeniero en energías renovables", "ingeniero ambiental", "técnico electricista", "instalador fotovoltaico"]
  senales:
    - dato: "Ingenieros en energías renovables e ingenieros ambientales en la lista de mayor crecimiento global"
      fuente: wef-foj-2025
    - dato: "Gestión ambiental: 69% de las empresas en México espera mayor uso hacia 2030"
      fuente: wef-foj-2025
    - dato: "232 proyectos registrados por Banobras demandarán perfiles de energía, mantenimiento y gestión ambiental"
      fuente: imco-tendencias
  advertencia: "La carrera 'Tecnología para la protección del medio ambiente' está entre las 10 de mayor riesgo de informalidad o desempleo (31.8%) y tiene 8.9% de desempleo. La demanda existe en ingeniería y oficios técnicos, no en cualquier programa con nombre ambiental."
  fuente_url: https://www.weforum.org/publications/the-future-of-jobs-report-2025
  fecha_verificacion: 2026-10-24

- id: fam-soporte-ti-redes
