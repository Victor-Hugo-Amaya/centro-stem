- id: fam-administracion-contabilidad
  nombre: "Administración, contabilidad y apoyo de oficina"
  nivel_demanda: descenso
  puntaje_demanda: 30
  roles_ejemplo: ["auxiliar contable", "asistente administrativo", "capturista"]
  senales:
    - dato: "Auxiliares de contabilidad y nómina: −20%; asistentes administrativos: −25% de crecimiento neto en México"
      fuente: wef-foj-2025
    - dato: "El trabajo administrativo es el único grupo con exposición alta a la IA generativa (24% de sus tareas)"
      fuente: oit-wp96
    - dato: "Contabilidad y fiscalización: desempleo de 1.9% y 1.27 millones de profesionistas"
      fuente: imco-cc-plataforma
  advertencia: "Hoy la carrera tiene empleo; lo que cae es la demanda de tareas rutinarias. La recomendación es complementar (datos, fintech, auditoría de sistemas), no abandonar."
  fuente_url: https://www.weforum.org/publications/the-future-of-jobs-report-2025
  fecha_verificacion: 2026-10-24
