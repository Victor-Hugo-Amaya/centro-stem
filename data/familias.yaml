# Familias ocupacionales STEM, ordenadas por nivel de demanda.
# Criterio de `nivel_demanda` (docs/05-catalogo.md §2):
#   muy_alta (90): crecimiento neto ≥ 40% en el perfil México del WEF, o rol en el top global del WEF
#                  con una señal de escasez en México (IMCO, Coursera).
#   alta (75):     rol en la lista de mayor crecimiento global del WEF o habilidad de uso creciente ≥ 70%
#                  en México, más al menos una señal nacional.
#   media (55):    señales mixtas o sólo indirectas.
#   descenso (30): el WEF proyecta caída neta del rol en México.
# El puntaje alimenta el componente `demanda` del motor (docs/02 §7). Es una hipótesis inicial:
# el loop semanal (paso 3) debe sustituirlo por frecuencia observada en vacantes.

- id: fam-datos-ia
  nombre: "Datos e inteligencia artificial"
  nivel_demanda: muy_alta
  puntaje_demanda: 90
  roles_ejemplo: ["analista de datos", "científico de datos", "especialista en IA y aprendizaje automático", "ingeniero de datos"]
  senales:
    - dato: "Analistas y científicos de datos: +47% de crecimiento neto proyectado en México 2025-2030; especialistas en IA y ML: +46%"
      fuente: wef-foj-2025
    - dato: "IA y big data: 93% de las empresas en México espera mayor uso de esta habilidad hacia 2030"
      fuente: wef-foj-2025
    - dato: "Demanda de empleadores por IA y aprendizaje automático en México: +338%"
      fuente: coursera-gsr-2025
    - dato: "TI y análisis de datos son las vacantes más difíciles de cubrir (26%, Manpower 2025)"
      fuente: imco-cc-2025
  fuente_url: https://www.weforum.org/publications/the-future-of-jobs-report-2025
  fecha_verificacion: 2026-10-24

- id: fam-ciberseguridad
  nombre: "Ciberseguridad"
  nivel_demanda: muy_alta
  puntaje_demanda: 90
  roles_ejemplo: ["analista de seguridad de la información", "analista SOC", "especialista en gestión de seguridad"]
  senales:
    - dato: "Especialistas en gestión de seguridad y analistas de seguridad de la información están en la lista de mayor crecimiento global"
      fuente: wef-foj-2025
    - dato: "Redes y ciberseguridad: 73% de las empresas en México espera mayor uso hacia 2030"
      fuente: wef-foj-2025
    - dato: "Déficit regional de 1.3 millones de profesionales de ciberseguridad; inscripciones en ciberseguridad +94% en México"
      fuente: coursera-gsr-2025
  fuente_url: https://www.weforum.org/publications/the-future-of-jobs-report-2025
  fecha_verificacion: 2026-10-24

- id: fam-software-nube
  nombre: "Desarrollo de software y nube"
  nivel_demanda: alta
  puntaje_demanda: 75
  roles_ejemplo: ["desarrollador de software", "ingeniero DevOps", "ingeniero de nube", "ingeniero FinTech"]
  senales:
    - dato: "Desarrolladores de software, ingenieros DevOps e ingenieros FinTech en la lista de mayor crecimiento global"
      fuente: wef-foj-2025
    - dato: "Desarrollo de software: +10.8% de primer ingreso entre los ciclos 2023-24 y 2024-25"
      fuente: imco-cc-2025
  advertencia: "Los puestos de entrada en México pasaron de crecer cerca de 9% anual (2021) a menos de 3% (2023-2025). Sin portafolio, la competencia para el primer empleo es alta."
  fuente_url: https://www.weforum.org/publications/the-future-of-jobs-report-2025
  fecha_verificacion: 2026-10-24

- id: fam-manufactura-avanzada
