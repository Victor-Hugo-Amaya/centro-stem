# Directorio de vouchers, descuentos, becas, retos, voluntariados y prácticas (México y LatAm).
#
# tipo:   voucher | descuento | beca | apoyo_economico | reto | voluntariado | practicas | programa
# estado: abierta (convocatoria con fecha vigente) | permanente (sin convocatoria, disponible siempre)
#         | recurrente (se repite; hay que vigilar la siguiente) | cerrada | por_confirmar
# fuente_tipo: oficial | secundaria. Una fuente secundaria nunca basta para mostrar "abierta".
# revisar_antes: fecha límite para que el loop semanal (paso 3) vuelva a verificar el registro.
# Edades en `publico`: la regla de menores (docs/02 §7) usa edad_min.

