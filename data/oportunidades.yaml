  tipo: descuento
  organizacion: org-microsoft
  beneficio: "Un examen con 50% de descuento por cada Virtual Training Day completado. Debe presentarse dentro de los 90 días posteriores al evento; no se combina con otras ofertas."
  publico: {edad_min: 18, nota: "Edad no indicada por Microsoft; se asume adulto por ser evento profesional."}
  costo_participante: 0
  estado: recurrente
  aplica_a: [cert-microsoft-az-900, cert-microsoft-ai-901]
  nota: "Es obligatorio asistir a todas las sesiones. El descuento se aplica al perfil de Microsoft Learn del correo registrado unos cinco días hábiles después."
  fuente_url: https://arch-center.azureedge.net/Credentials/microsoft-mvtd-cert-faq-en-us.pdf
  fuente_tipo: oficial
  fecha_verificacion: 2026-10-24
  revisar_antes: 2026-11-30

